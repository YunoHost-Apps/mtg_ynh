#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2
id = "mtg"
name = "mtg"
description.en = "Highly-opinionated MTPROTO proxy for Telegram"
description.fr = "Proxy MTProto pour Telegram"

version = "2.3.0~ynh1"

maintainers = ["mrpsycho"]

[upstream]
license = "MIT"
code = "https://github.com/9seconds/mtg"
admindoc = "https://github.com/9seconds/mtg/blob/master/README.md"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

ram.build = "50M"
ram.runtime = "50M"
disk = "50M"

[install]
    [install.port]
    type = "string"
    ask.en = "Choose a port for the proxy to bind to"
    ask.fr = "Choisissez un port auquel le proxy doit se connecter"
    default = "3128"

    [install.secret]
    type = "string"
    ask.en = "Enter the MTProto Secret (Starts with 'ee...' or provide a fronting domain like google.com to auto-generate)"
    ask.fr = "Saisissez le secret MTProto (commençant par « ee... » ou indiquez un domaine de base tel que google.com pour qu'il soit généré automatiquement)"
    default = "google.com"

    [install.dns]
    type = "string"
    ask.en = "Enter the DNS resolver IP"
    ask.fr = "Saisissez l'adresse IP du résolveur DNS"
    default = "1.1.1.1"

    [install.prometheus]
    type = "boolean"
    ask.en = "Enable Prometheus metrics?"
    ask.fr = "Activer les métriques Prometheus ?"
    default = false

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.sources.main]
    # x86_64 / amd64
    amd64.url = "https://github.com/9seconds/mtg/releases/download/v2.3.0/mtg-2.3.0-linux-amd64.tar.gz"
    amd64.sha256 = "11c038ea5eeebd5d49148048975c24f7b0c4fa4c1cf4f15a2410203e2da01812"
    # i386
    i386.url = "https://github.com/9seconds/mtg/releases/download/v2.3.0/mtg-2.3.0-linux-386.tar.gz"
    i386.sha256 = "4f8fffa94bf4cad75a6b059d4a543efda62fc77921f4321186b6795269f3fe8e"
    # arm64 / aarch64
    arm64.url = "https://github.com/9seconds/mtg/releases/download/v2.3.0/mtg-2.3.0-linux-arm64.tar.gz"
    arm64.sha256 = "86e0fc6f50bfb453b7a6e8b91497c6661a7d64a3f607828e0e42f534d795ac5a"
    # armhf / armv7
    armhf.url = "https://github.com/9seconds/mtg/releases/download/v2.3.0/mtg-2.3.0-linux-armv7.tar.gz"
    armhf.sha256 = "4be262a4099807700f1a62b11d993c096a6011a510975d82ea86ca72e49ccb89"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = '^mtg-.*-linux-amd64\.tar\.gz$'
    autoupdate.asset.i386 = '^mtg-.*-linux-386\.tar\.gz$'
    autoupdate.asset.arm64 = '^mtg-.*-linux-arm64\.tar\.gz$'
    autoupdate.asset.armhf = '^mtg-.*-linux-armv7\.tar\.gz$'
